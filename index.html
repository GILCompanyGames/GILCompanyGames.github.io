<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GILCompany</title>
<meta name="description" content="GILCompany - 개인 게임 개발자. Brain Triple Pick을 만들었습니다.">
<style>
  /* 색: 게임의 어두운 돌판과 청동색에 맞췄다 */
  :root { --bg:#14120f; --panel:#1f1c18; --line:#3a342b; --text:#e9e3d6; --dim:#a79f8f; --gold:#d8b25a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; line-height:1.7; }
  main { max-width:720px; margin:0 auto; padding:48px 20px 64px; }
  h1 { font-size:2rem; margin:0 0 4px; color:var(--gold); letter-spacing:.02em; }
  .sub { color:var(--dim); margin:0 0 36px; }
  h2 { font-size:1.05rem; color:var(--dim); font-weight:600; margin:36px 0 12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px 22px; }
  .card h3 { margin:0 0 6px; font-size:1.25rem; }
  .card p { margin:0 0 12px; color:var(--dim); }
  a { color:var(--gold); }
  .links a { display:inline-block; margin-right:18px; }
  footer { margin-top:48px; padding-top:18px; border-top:1px solid var(--line); color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>GILCompany</h1>
  <p class="sub">개인 게임 개발자 · Independent game developer</p>

  <h2>게임 · Games</h2>
  <div class="card">
    <h3>Brain Triple Pick</h3>
    <p>카드 9장에서 숨은 세트를 찾아내는 두뇌 게임 (Android)<br>
       A brain game where you find hidden sets among nine cards (Android)</p>
    <div class="links">
      <a href="privacy.html#ko">개인정보 처리방침</a>
      <a href="privacy.html#en">Privacy Policy</a>
    </div>
  </div>

  <h2>문의 · Contact</h2>
  <div class="card">
    <a href="mailto:onejones@naver.com">onejones@naver.com</a>
  </div>

  <footer>© 2026 GILCompany</footer>
</main>
</body>
</html>
